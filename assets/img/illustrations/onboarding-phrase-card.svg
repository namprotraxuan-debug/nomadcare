<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-hidden="true">
  <!-- Onboarding 2: one-tap bilingual medical phrase card (VI for staff + traveler language). P1 shell. -->
  <defs>
    <linearGradient id="pc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A3D" stop-opacity=".16"/><stop offset="1" stop-color="#14B8A6" stop-opacity=".14"/></linearGradient>
    <linearGradient id="pc-hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E9384"/><stop offset="1" stop-color="#14B8A6"/></linearGradient>
  </defs>
  <path d="M34 128c0-58 52-100 124-100s128 38 128 96-50 96-126 96S34 186 34 128Z" fill="url(#pc-bg)"/>
  <!-- phone -->
  <rect x="96" y="30" width="112" height="190" rx="20" fill="#0F1F1E"/>
  <rect x="102" y="36" width="100" height="178" rx="15" fill="#FFFFFF"/>
  <rect x="102" y="36" width="100" height="44" rx="15" fill="url(#pc-hd)"/>
  <rect x="102" y="64" width="100" height="16" fill="url(#pc-hd)"/>
  <rect x="114" y="48" width="40" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".9"/>
  <rect x="114" y="61" width="26" height="6" rx="3" fill="#FFFFFF" fill-opacity=".6"/>
  <!-- VI block -->
  <rect x="112" y="92" width="26" height="16" rx="8" fill="#E3F5F2"/>
  <text x="125" y="104" text-anchor="middle" font-size="10" font-weight="800" fill="#0A7568" font-family="'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">VI</text>
  <rect x="112" y="115" width="80" height="9" rx="4.5" fill="#0F1F1E"/>
  <rect x="112" y="129" width="62" height="9" rx="4.5" fill="#0F1F1E"/>
  <!-- EN block -->
  <rect x="112" y="152" width="26" height="16" rx="8" fill="#FFF0E8"/>
  <text x="125" y="164" text-anchor="middle" font-size="10" font-weight="800" fill="#D84E12" font-family="'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">EN</text>
  <rect x="112" y="175" width="70" height="7" rx="3.5" fill="#728785"/>
  <rect x="112" y="187" width="52" height="7" rx="3.5" fill="#728785"/>
  <!-- speech bubbles -->
  <g transform="translate(212 58)">
    <path d="M0 14A14 14 0 0 1 14 0h44a14 14 0 0 1 14 14v18a14 14 0 0 1-14 14H22l-12 10 2-10A14 14 0 0 1 0 32Z" fill="#FFFFFF" stroke="#0E9384" stroke-opacity=".25" stroke-width="1.5"/>
    <rect x="14" y="14" width="44" height="6" rx="3" fill="#0E9384"/>
    <rect x="14" y="26" width="30" height="6" rx="3" fill="#0E9384" fill-opacity=".45"/>
  </g>
  <g transform="translate(34 128)">
    <path d="M72 14A14 14 0 0 0 58 0H14A14 14 0 0 0 0 14v18a14 14 0 0 0 14 14h36l12 10-2-10a14 14 0 0 0 12-14Z" fill="#FFFFFF" stroke="#FF6B2C" stroke-opacity=".35" stroke-width="1.5"/>
    <rect x="14" y="14" width="44" height="6" rx="3" fill="#FF6B2C"/>
    <rect x="14" y="26" width="28" height="6" rx="3" fill="#FF6B2C" fill-opacity=".45"/>
  </g>
  <!-- medical cross badge -->
  <g transform="translate(222 150)">
    <circle cx="22" cy="22" r="22" fill="#E5484D"/>
    <path d="M18.5 11h7v8h8v7h-8v8h-7v-8h-8v-7h8Z" fill="#FFFFFF"/>
  </g>
  <!-- tap ripple -->
  <circle cx="186" cy="100" r="12" fill="#FF6B2C" fill-opacity=".18"/>
  <circle cx="186" cy="100" r="5.5" fill="#FF6B2C"/>
</svg>
