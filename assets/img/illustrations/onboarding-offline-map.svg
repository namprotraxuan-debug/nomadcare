<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-hidden="true">
  <!-- Onboarding 1: offline map with 3-level signal zones along the route. P1 shell. -->
  <defs>
    <linearGradient id="om-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6" stop-opacity=".18"/><stop offset="1" stop-color="#38BDF8" stop-opacity=".10"/></linearGradient>
    <linearGradient id="om-sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F1F1E" stop-opacity=".10"/><stop offset="1" stop-color="#0F1F1E" stop-opacity="0"/></linearGradient>
  </defs>
  <path d="M40 120C40 60 96 26 164 28c70 2 124 40 124 98 0 60-54 92-128 92S40 184 40 120Z" fill="url(#om-bg)"/>
  <ellipse cx="162" cy="208" rx="104" ry="9" fill="url(#om-sh)"/>
  <!-- folded map -->
  <g stroke="#0E9384" stroke-opacity=".22" stroke-width="1.5" stroke-linejoin="round">
    <path d="M62 64 128 48v140l-66 16Z" fill="#FFFFFF"/>
    <path d="M128 48l66 16v140l-66-16Z" fill="#EEF6F5"/>
    <path d="M194 64l66-16v140l-66 16Z" fill="#FFFFFF"/>
  </g>
  <!-- terrain contours -->
  <g fill="none" stroke="#0E9384" stroke-opacity=".16" stroke-width="1.4">
    <path d="M80 90c14-8 30-6 40 4"/><path d="M76 104c20-12 42-8 54 6"/>
    <path d="M204 150c12-10 30-12 44-2"/><path d="M200 166c18-14 40-14 56-2"/>
    <path d="M140 80c10 6 24 6 36-2"/>
  </g>
  <!-- route: likely / uncertain / lost -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
    <path d="M84 176c10-22 26-30 44-34" stroke="#16A765"/>
    <path d="M128 142c20-4 34-12 44-30" stroke="#F2A20C"/>
    <path d="M172 112c10-18 28-26 48-26" stroke="#E5484D" stroke-dasharray="2 11"/>
    <path d="M220 86c10 0 18-4 24-10" stroke="#16A765"/>
  </g>
  <!-- start dot -->
  <circle cx="84" cy="176" r="9" fill="#FFFFFF" stroke="#0E9384" stroke-width="4"/>
  <!-- destination pin with medical cross -->
  <g transform="translate(232 30)">
    <path d="M16 50C10 42 0 32 0 20a16 16 0 0 1 32 0c0 12-10 22-16 30Z" fill="#E5484D"/>
    <path d="M13.5 12h5v5.5H24v5h-5.5V28h-5v-5.5H8v-5h5.5Z" fill="#FFFFFF"/>
  </g>
  <!-- signal tower with arcs -->
  <g transform="translate(92 38)">
    <path d="M10 44 16 14l6 30" fill="none" stroke="#0A7568" stroke-width="3" stroke-linejoin="round"/>
    <path d="M12 34h8" stroke="#0A7568" stroke-width="3" stroke-linecap="round"/>
    <circle cx="16" cy="12" r="4" fill="#0E9384"/>
    <path d="M6 4a14 14 0 0 0 0 16M26 4a14 14 0 0 1 0 16" fill="none" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- offline badge -->
  <g transform="translate(40 150)">
    <circle cx="22" cy="22" r="22" fill="#FF6B2C"/>
    <path d="M13 27.5h16.5a5.5 5.5 0 0 0 .6-11A8 8 0 0 0 15 18a5 5 0 0 0-2 9.5Z" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M11 13l22 20" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <!-- legend dots -->
  <g transform="translate(206 194)">
    <rect x="-8" y="-11" width="86" height="22" rx="11" fill="#FFFFFF" stroke="#0E9384" stroke-opacity=".18"/>
    <circle cx="6" cy="0" r="5" fill="#16A765"/><circle cx="31" cy="0" r="5" fill="#F2A20C"/><circle cx="56" cy="0" r="5" fill="#E5484D"/>
  </g>
</svg>
