<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-hidden="true">
  <!-- Onboarding 4: Buddy check-in / dead-man switch — shield, clock and a trusted contact. P1 shell. -->
  <defs>
    <linearGradient id="bd-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6" stop-opacity=".16"/><stop offset="1" stop-color="#FF9A3D" stop-opacity=".12"/></linearGradient>
    <linearGradient id="bd-sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1CC6B2"/><stop offset="1" stop-color="#0A7568"/></linearGradient>
  </defs>
  <path d="M28 124c0-58 58-98 134-98s130 42 130 98-58 94-132 94S28 182 28 124Z" fill="url(#bd-bg)"/>
  <!-- dashed trail between traveler and contact -->
  <path d="M86 150c30-40 70-54 108-40s52 16 72-6" fill="none" stroke="#0E9384" stroke-opacity=".45" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
  <!-- traveler phone -->
  <g transform="translate(46 108)">
    <rect x="0" y="0" width="52" height="92" rx="12" fill="#0F1F1E"/>
    <rect x="4" y="4" width="44" height="84" rx="9" fill="#FFFFFF"/>
    <circle cx="26" cy="36" r="14" fill="#E4F7EE"/>
    <path d="M20 36l4.5 4.5L33 32" fill="none" stroke="#16A765" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="12" y="60" width="28" height="6" rx="3" fill="#0E9384"/>
    <rect x="16" y="70" width="20" height="5" rx="2.5" fill="#728785" fill-opacity=".5"/>
  </g>
  <!-- shield -->
  <g transform="translate(126 52)">
    <path d="M34 0c10 8 22 12 34 12v34c0 30-18 46-34 54C18 92 0 76 0 46V12C12 12 24 8 34 0Z" fill="url(#bd-sh)"/>
    <path d="M22 50l9 9 17-19" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- clock -->
  <g transform="translate(186 40)">
    <circle cx="20" cy="20" r="19" fill="#FFFFFF" stroke="#FF6B2C" stroke-width="3"/>
    <path d="M20 10v10l7 4" fill="none" stroke="#FF6B2C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- trusted contact -->
  <g transform="translate(236 76)">
    <circle cx="26" cy="26" r="26" fill="#FFFFFF" stroke="#0E9384" stroke-opacity=".25" stroke-width="1.5"/>
    <circle cx="26" cy="20" r="8" fill="#0E9384"/>
    <path d="M12 40a14 12 0 0 1 28 0" fill="#0E9384"/>
  </g>
  <!-- envelope -->
  <g transform="translate(222 150)">
    <rect x="0" y="0" width="54" height="38" rx="8" fill="#FFFFFF" stroke="#FF6B2C" stroke-opacity=".45" stroke-width="1.5"/>
    <path d="M6 8l21 15 21-15" fill="none" stroke="#FF6B2C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- last known location sent along the trail -->
  <g transform="translate(200 88)"><path d="M9 24C6 20 0 15 0 9a9 9 0 0 1 18 0c0 6-6 11-9 15Z" fill="#E5484D"/><circle cx="9" cy="9" r="3.2" fill="#FFFFFF"/></g>
</svg>
