<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="nc-logo-t">
  <title id="nc-logo-t">NomadCare</title>
  <!-- NomadCare mark: location pin whose head is a lifebuoy (chiếc phao), with signal arcs. Original artwork, P1 shell. -->
  <defs>
    <linearGradient id="ncPin" x1="10" y1="10" x2="44" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1CC6B2"/>
      <stop offset=".55" stop-color="#0E9384"/>
      <stop offset="1" stop-color="#0A6B60"/>
    </linearGradient>
    <linearGradient id="ncArc" x1="34" y1="4" x2="54" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A3D"/>
      <stop offset="1" stop-color="#FF6B2C"/>
    </linearGradient>
  </defs>
  <!-- signal arcs -->
  <path d="M35.35 8.99A23 23 0 0 1 47.61 22.13" fill="none" stroke="url(#ncArc)" stroke-width="4" stroke-linecap="round"/>
  <path d="M38 3.05A29.5 29.5 0 0 1 53.72 19.91" fill="none" stroke="url(#ncArc)" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <!-- pin -->
  <path d="M26 62C21.8 56.6 11.4 46 9.9 38A18 18 0 1 1 42.1 38C40.6 46 30.2 56.6 26 62Z" fill="url(#ncPin)"/>
  <!-- lifebuoy ring -->
  <circle cx="26" cy="30" r="8.75" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="26" cy="30" r="8.75" fill="none" stroke="#FF6B2C" stroke-width="6" stroke-dasharray="6.872 6.872" stroke-dashoffset="10.309"/>
  <circle cx="26" cy="30" r="11.75" fill="none" stroke="#0A6B60" stroke-opacity=".18" stroke-width=".8"/>
</svg>
